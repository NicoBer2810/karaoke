<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoké - Écran</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --bg: #12101a; --panel: #1d1a29; --line: #2e2a40;
    --text: #f3f0fa; --muted: #9a94b0; --accent: #ff4f8b; --accent2: #ffb84f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }
  .layout { display: grid; grid-template-columns: 1fr 230px; height: 100vh; }
  .stage { position: relative; background: #000; display: flex; flex-direction: column; min-width: 0; }
  #player-box { flex: 1; position: relative; }
  #player-box iframe, #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .now-bar {
    padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  .now-bar .label { color: var(--accent); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .now-bar .title { font-size: 17px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--text); padding: 6px 10px;
  }
  button.primary {
    border: 0; font-weight: 700; color: #1a0f14;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  #idle {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 30%, #2a1838, #000 70%);
  }
  #idle h1 { margin: 0; font-size: clamp(32px, 5vw, 64px); }
  #idle h1 span { color: var(--accent); }
  #idle p { margin: 0; color: var(--muted); font-size: 20px; }
  .qr { background: #fff; padding: 10px; border-radius: 12px; display: inline-block; line-height: 0; }
  #gate {
    position: fixed; inset: 0; z-index: 50; background: rgba(10, 8, 16, .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px;
  }
  #gate form { display: flex; flex-direction: column; gap: 12px; width: min(320px, 90vw); }
  #gate input {
    padding: 14px; font-size: 18px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); text-align: center;
  }
  #gate button { font-size: 20px; padding: 14px; border-radius: 12px; }
  #gate p { color: var(--muted); max-width: 380px; text-align: center; margin: 0; }
  #gate .err { color: var(--accent); min-height: 1.2em; }
  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  aside h2 { margin: 0; padding: 14px 14px 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .queue { flex: 1; overflow-y: auto; padding: 0 10px 10px; counter-reset: q; }
  .q-item {
    display: flex; gap: 8px; padding: 8px 6px; border-bottom: 1px solid var(--line);
    font-size: 14px; line-height: 1.3;
  }
  .q-item::before {
    counter-increment: q; content: counter(q); color: var(--accent2); font-weight: 700; min-width: 16px;
  }
  .q-item span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px; }
  .scan-me { margin-top: 10px; font-weight: 700; color: var(--accent2); font-size: 16px; }
  #idle .scan-me { font-size: 22px; margin-top: 0; }
  .side-qr { padding: 14px; border-top: 1px solid var(--line); text-align: center; }
  @media (max-width: 700px) {
    body { overflow: auto; }
    .layout { grid-template-columns: 1fr; height: auto; }
    .stage { height: 60vh; }
  }
</style>
</head>
<body>
<div id="gate">
  <h1 style="margin:0">🎤 Karaoké</h1>
  <form id="gate-form">
    <button class="primary" type="submit" id="gate-btn">Démarrer l'écran</button>
    <div class="err" id="gate-err"></div>
  </form>
  <p>Le clic sur "Démarrer" autorise aussi le navigateur à lire les vidéos avec le son.</p>
</div>

<div class="layout">
  <section class="stage">
    <div id="player-box">
      <div id="player"></div>
      <div id="idle">
        <h1>🎤 Karao<span>ké</span></h1>
        <p>Scanne le QR code pour choisir ta chanson</p>
        <div class="qr" id="qr-big"></div>
        <div class="scan-me">Scannez-moi pour ajouter une chanson</div>
      </div>
    </div>
    <div class="now-bar">
      <span class="label">En cours</span>
      <span class="title" id="now-title">Rien pour l'instant</span>
      <button id="skip-btn" title="Passer à la suivante">⏭</button>
    </div>
  </section>

  <aside>
    <h2>À suivre</h2>
    <div class="queue" id="queue"></div>
    <div class="side-qr"><div class="qr" id="qr-small"></div><div class="scan-me">Scannez-moi pour ajouter une chanson</div></div>
  </aside>
</div>

<script>
  const BROKER = "wss://broker.hivemq.com:8884/mqtt";
  const NS = "karaoke-thelio-nb";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const norm = (s) => (s || "").trim().toLowerCase();

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  function newCode(len) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let c = "";
    for (let i = 0; i < len; i++) c += chars[Math.floor(Math.random() * chars.length)];
    return c;
  }

  // La salle sert aussi de jeton d'accès : le QR code la contient, ce qui évite le mot de passe.
  let room = store.get("kara_room") || newCode(8);
  store.set("kara_room", room);

  let state = { now: null, queue: [], users: [], sung: {} };
  try {
    const saved = JSON.parse(store.get("kara_state_" + room) || "null");
    if (saved && Array.isArray(saved.queue)) state = Object.assign(state, saved);
  } catch (e) {}
  if (!state.sung || typeof state.sung !== "object") state.sung = {};
  const seen = new Set();

  let started = false;
  let player = null;
  let playerReady = false;
  let client = null;

  // ---------- Accès ----------
  $("gate-form").onsubmit = (e) => {
    e.preventDefault();
    started = true;
    $("gate").style.display = "none";
    if (playerReady) {
      if (state.now) player.loadVideoById(state.now.id);
      else if (state.queue.length) playNext();
    }
    connect();
  };

  // ---------- Affichage ----------
  // Adresse publique du site : utilisée quand l'écran est ouvert en local (fichier, localhost, réseau privé),
  // pour que le QR code pointe toujours vers une adresse joignable depuis un téléphone.
  const PUBLIC_URL = "https://nicober2810.github.io/karaoke/";

  function remoteUrl() {
    const h = location.hostname;
    const isLocal = !/^https?:$/.test(location.protocol) || !h || h === "localhost" ||
      /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h) || h.endsWith(".local");
    const base = isLocal ? PUBLIC_URL : location.href.replace(/[^/]*([?#].*)?$/, "");
    return base + "recherche.html?room=" + room;
  }

  function renderQr() {
    const url = remoteUrl();
    $("qr-big").innerHTML = "";
    $("qr-small").innerHTML = "";
    if (!window.qrcode) return;
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    const draw = (el, px) => {
      const n = qr.getModuleCount();
      const cell = Math.max(2, Math.floor(px / n));
      el.innerHTML = qr.createSvgTag({ cellSize: cell, margin: 0, scalable: false });
      el.title = url;
    };
    draw($("qr-big"), 240);
    draw($("qr-small"), 180);
  }

  function renderQueue() {
    const box = $("queue");
    box.innerHTML = "";
    if (!state.queue.length) box.innerHTML = '<div class="empty">Aucune chanson en attente</div>';
    state.queue.forEach((it) => {
      const row = document.createElement("div");
      row.className = "q-item";
      const s = document.createElement("span");
      s.textContent = it.title;
      row.append(s);
      box.append(row);
    });
    $("now-title").textContent = state.now ? state.now.title : "Rien pour l'instant";
    $("idle").style.display = state.now ? "none" : "flex";
  }

  function changed() {
    store.set("kara_state_" + room, JSON.stringify(state));
    renderQueue();
    publishState();
  }

  // ---------- Lecture ----------
  function playNext() {
    state.now = state.queue.shift() || null;
    if (state.now) { const k = norm(state.now.by); state.sung[k] = (state.sung[k] || 0) + 1; }
    if (playerReady) {
      if (state.now) player.loadVideoById(state.now.id);
      else player.stopVideo();
    }
    changed();
  }

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("player", {
      width: "100%", height: "100%",
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => {
          playerReady = true;
          if (started && state.now) player.loadVideoById(state.now.id);
          else if (started && state.queue.length) playNext();
        },
        onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) playNext(); },
        onError: () => { setTimeout(playNext, 1500); }
      }
    });
  };

  function loadYouTubeApi() {
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.append(s);
  }

  // ---------- Comptes ----------
  function canonicalName(name) {
    const n = norm(name);
    if (!n) return "";
    const found = state.users.find((u) => norm(u) === n);
    if (found) return found;
    const clean = name.trim().slice(0, 30);
    state.users.push(clean);
    return clean;
  }

  // ---------- Alternance ----------
  // Chaque chanson a un "tour" : chansons déjà chantées par son auteur + son rang parmi ses chansons en attente.
  // Une nouvelle chanson passe devant la première chanson d'un tour plus élevé que le sien.
  // À tour égal, la chanson déjà présente garde sa place.
  function insertFair(item) {
    const sungBy = (name) => state.sung[norm(name)] || 0;
    const queued = {};
    const turnOf = (it) => {
      const k = norm(it.by);
      queued[k] = (queued[k] || 0) + 1;
      return sungBy(it.by) + queued[k];
    };
    const turns = state.queue.map(turnOf);
    const myTurn = sungBy(item.by) + state.queue.filter((it) => norm(it.by) === norm(item.by)).length + 1;
    let pos = state.queue.length;
    for (let i = 0; i < state.queue.length; i++) {
      if (turns[i] > myTurn) { pos = i; break; }
    }
    state.queue.splice(pos, 0, item);
  }

  function newUid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ---------- Synchro ----------
  function publishState() {
    if (!client || !client.connected) return;
    client.publish(NS + "/" + room + "/state",
      JSON.stringify({ now: state.now, queue: state.queue, users: state.users, ts: Date.now() }),
      { retain: true, qos: 1 });
  }

  function handleCommand(msg) {
    if (msg.cid) {
      if (seen.has(msg.cid)) return;
      seen.add(msg.cid);
    }
    const by = msg.by ? canonicalName(msg.by) : "";
    const mine = (it) => it && by && norm(it.by) === norm(by);

    if (msg.type === "join") {
      changed();
    } else if (msg.type === "add" && msg.id && by) {
      insertFair({ uid: newUid(), cid: msg.cid || "", id: msg.id, title: msg.title || "Sans titre", thumb: msg.thumb || "", by });
      if (!state.now && started) playNext(); else changed();
    } else if (msg.type === "remove") {
      const i = state.queue.findIndex((it) => it.uid === msg.uid && mine(it));
      if (i >= 0) { state.queue.splice(i, 1); changed(); }
    } else if (msg.type === "move") {
      const i = state.queue.findIndex((it) => it.uid === msg.uid && mine(it));
      if (i < 0) return;
      const step = msg.dir < 0 ? -1 : 1;
      let j = i + step;
      while (j >= 0 && j < state.queue.length && !mine(state.queue[j])) j += step;
      if (j < 0 || j >= state.queue.length) return;
      const tmp = state.queue[i]; state.queue[i] = state.queue[j]; state.queue[j] = tmp;
      changed();
    } else if (msg.type === "skip") {
      if (mine(state.now)) playNext();
    } else if (msg.type === "hello") {
      publishState();
    }
  }

  function connect() {
    if (client) return;
    client = mqtt.connect(BROKER, { clientId: "screen-" + Math.random().toString(16).slice(2), reconnectPeriod: 2000, clean: true });
    client.on("connect", () => {
      client.subscribe(NS + "/" + room + "/cmd", { qos: 1 });
      client.publish(NS + "/lobby", JSON.stringify({ room }), { retain: true, qos: 1 });
      publishState();
    });
    client.on("message", (topic, payload) => {
      try { handleCommand(JSON.parse(payload.toString())); } catch (e) {}
    });
  }

  $("skip-btn").onclick = () => playNext();

  renderQr();
  renderQueue();
  loadYouTubeApi();
</script>
</body>
</html>
